name: Deploy docs site

# Builds the Astro/Starlight site in wwwdocs/ and deploys it to GitHub Pages,
# served at the custom domain in wwwdocs/public/CNAME (seer.shaid.net).
#
# wwwdocs/scripts/sync-docs.mjs (run automatically by `npm run build` via the
# prebuild hook) pulls the real source docs -- root docs/*.md and each
# package's README.md -- into wwwdocs/src/content/docs/ at build time, so this
# workflow only needs to build wwwdocs/; it never needs to know which files
# changed.

on:
  push:
    branches: [main]
    paths:
      - 'wwwdocs/**'
      - 'docs/**'
      - 'packages/*/README.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: wwwdocs/package-lock.json

      - name: Install dependencies
        working-directory: wwwdocs
        run: npm ci

      - name: Build site
        working-directory: wwwdocs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wwwdocs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
