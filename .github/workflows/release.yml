name: Release

# Publishes all packages to npm on a `v*` tag.
#
# They go out together on purpose: cross-package dependencies pin `^0.1.0`, so
# a partial release leaves versions on the registry that cannot be installed.
# `npm publish --workspaces` handles that in one pass.
#
# Requires an `NPM_TOKEN` repository secret (an automation token with publish
# rights on the `seer-project` org and the `create-seer-app` name).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds rather than after the full lint/test/verify run, which
      # is otherwise all wasted when the secret simply isn't configured.
      - name: Require an npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add an npm automation token" \
                 "with publish rights on the seer-project org to this" \
                 "repository's Actions secrets before tagging a release."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Prove the token authenticates *before* anything is published. Without
      # this the first real signal is a 401 partway through `npm publish
      # --workspaces`, by which point earlier packages may already be live and
      # their versions permanently burned.
      - name: Verify npm authentication and scope access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "authenticated as: $(npm whoami)"
          # The scoped packages cannot publish until the org exists. Checking
          # here turns a half-finished release into a clean pre-flight failure.
          if ! npm org ls seer-project >/dev/null 2>&1; then
            echo "::error::Cannot see the 'seer-project' npm org with this" \
                 "token. Create the org (free for public packages) and make" \
                 "sure the token has publish rights on it — otherwise the" \
                 "unscoped create-seer-app package would publish while every" \
                 "@seer-project/* package fails, leaving a partial release."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The check the workspace cannot perform on itself — see the script's
      # docblock. A release that fails this would ship types no consumer
      # outside this repo can resolve.
      - name: Verify the published types resolve for a consumer
        run: node scripts/verify-consumer.mjs

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG" >&2
            exit 1
          fi

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --workspaces --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry-run
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
